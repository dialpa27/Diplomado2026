<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/css/bootstrap.min.css">
    <title>Barras de Progreso</title>
</head>
<body>
<div class="container">
        <div class="row mt-5">
            <div class="col">
                <div class="progress mb-4" style="height: 15px;">
                    <div class="progress-bar progressbar progress-bar-striped progress-bar-animated bg-info" role="" style="width: 70%;"> 
                        70%
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="progress mb-4" style="height: 1px;">
                    <div class="progress-bar" role="progressbar" style="width: 50%;">
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="progress mb-4" style="height: 70px;">
                    <div class="progress-bar bg-danger" role="progressbar" style="width: 70%;">
                        75%
                    </div>
                </div>
            </div>
        <div class="col">
            <div class="progress mb-4" style="height: 100px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" role="progressbar" style="width: 100%;">
                </div>
            </div>
        </div>
        </div>
</div>
<script src="../JS/js/bootstrap.bundle.min.js"></script>    
</body>
</html>
