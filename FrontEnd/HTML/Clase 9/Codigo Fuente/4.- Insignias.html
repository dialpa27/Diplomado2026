<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/css/bootstrap.min.css">
    <title>Badges</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 m-4">
                <span class="badge bg-info p-2">Primary</span>
                <span class="badge bg-dark p-2 rounded-pill">Secondary</span>
            </div>
        </div>
        <div class="row">
            <div class="col-12 m-4">
                <button type="button" class="btn btn-primary">Bandeja de Entrada <span class="badge bg-light text-dark ms-2">12</span>
            </button>
            </div>
        </div>
    </div>
<script src="../JS/js/bootstrap.bundle.min.js"></script>
</body>
</html>
